<!-- Minimal Header for Transactional Page -->

<a class="font-headline-xl text-headline-xl font-bold tracking-tighter text-primary dark:text-on-primary" href="#">CLOTHY</a>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface-lowest shadow-sm border border-subtle rounded-lg p-lg bg-white relative overflow-hidden">
<!-- Decorative minimal background element -->
<div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 bg-surface-alt rounded-full opacity-50 pointer-events-none"></div>
<div class="text-center mb-lg relative z-10">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-xs">Đăng ký tài khoản</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Trở thành thành viên để nhận ưu đãi mới nhất</p>
</div>
<form action="#" class="space-y-md relative z-10" method="POST">
<!-- Full Name -->
<div>
<label class="sr-only" for="fullname">Họ và tên</label>
<input class="w-full border border-subtle rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-surface-bright" id="fullname" name="fullname" placeholder="Họ và tên" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="sr-only" for="email">Email</label>
<input class="w-full border border-subtle rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-surface-bright" id="email" name="email" placeholder="Email" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="sr-only" for="password">Mật khẩu</label>
<input class="w-full border border-subtle rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-surface-bright" id="password" name="password" placeholder="Mật khẩu" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="sr-only" for="confirm_password">Xác nhận mật khẩu</label>
<input class="w-full border border-subtle rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-surface-bright" id="confirm_password" name="confirm_password" placeholder="Xác nhận mật khẩu" required="" type="password"/>
</div>
<!-- Terms -->
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded-DEFAULT border-subtle text-primary-container focus:ring-primary bg-surface-bright" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">Tôi đồng ý với <a class="text-primary underline hover:opacity-80 transition-opacity" href="#">Điều khoản</a> &amp; <a class="text-primary underline hover:opacity-80 transition-opacity" href="#">Chính sách bảo mật</a></label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary rounded-lg py-sm px-md font-label-caps text-label-caps tracking-widest hover:bg-primary transition-all duration-200 hover:shadow-sm transform hover:scale-[1.02]" type="submit">
                    ĐĂNG KÝ
                </button>
</form>
<!-- Separator -->
<div class="mt-lg mb-md relative z-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-subtle"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-white font-body-sm text-body-sm text-text-muted">Hoặc</span>
</div>
